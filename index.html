    <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233182F6'/%3E%3Ccircle cx='50' cy='50' r='40' fill='%233182F6'/%3E%3Cpath d='M15 35h70M15 65h70M50 10c15 13 15 67 0 80M50 10c-15 13-15 67 0 80' fill='none' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    
    <meta name="apple-mobile-web-app-title" content="인구 수 퀴즈">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        :root {
            --toss-blue: #3182F6;
            --toss-gray-bg: #F2F4F6;
            --toss-text-main: #191F28;
            --toss-green: #34C759;
            --toss-red: #FF3B30;
        }
        
        body {
            font-family: 'Pretendard Variable', -apple-system, sans-serif;
            background-color: #E5E8EB;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        ::-webkit-scrollbar { display: none; }
        
        .btn-press {
            transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s, opacity 0.2s;
        }
        .btn-press:active:not(:disabled) {
            transform: scale(0.97);
        }

        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-btn {
            background-color: var(--toss-gray-bg);
            color: var(--toss-text-main);
            border: 2px solid transparent;
            transition: all 0.25s ease;
        }

        .option-btn.correct {
            background-color: rgba(52, 199, 89, 0.12) !important;
            border-color: var(--toss-green) !important;
            color: #12822C !important;
            transform: scale(1.02);
            z-index: 10;
        }
        .option-btn.wrong {
            background-color: rgba(255, 59, 48, 0.12) !important;
            border-color: var(--toss-red) !important;
            color: #C51309 !important;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        .option-btn.dimmed {
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .progress-bar {
            transition: width 0.3s ease-out;
        }

        .app-container {
            width: 100%;
            height: 100dvh;
        }

        @media (min-width: 640px) {
            .app-container {
                max-width: 600px;
                height: clamp(680px, 90vh, 820px);
                border-radius: 32px;
                box-shadow: 0 24px 60px -12px rgba(0,0,0,0.12);
            }
        }

        @media (min-width: 768px) and (orientation: landscape), (min-width: 900px) {
            .app-container {
                max-width: 920px;
                height: clamp(520px, 85vh, 640px);
            }
            .ls-row { flex-direction: row !important; align-items: center !important; }
            .ls-left-align { align-items: flex-start !important; text-align: left !important; }
            .ls-self-start { align-self: flex-start !important; }
            .ls-my-0 { margin-top: 0 !important; margin-bottom: 0 !important; }
            .ls-ml-0 { margin-left: 0 !important; margin-right: auto !important; }
            .ls-w-half { flex: 1 !important; width: auto !important; }
            .ls-divider-v { display: block !important; width: 1px !important; height: 60% !important; background-color: rgba(0,0,0,0.06); margin: 0 2rem; }
            .ls-divider-h { display: none !important; }
        }
    </style>
</head>

<script>
    const countriesData = [

        { name: "탄자니아", code: "tz", pop: 65497000, age: [43, 54, 3], medianAge: 17.7 },
        { name: "남아프리카 공화국", code: "za", pop: 60414000, age: [28, 66, 6], medianAge: 27.6 },
        { name: "이탈리아", code: "it", pop: 58870000, age: [12, 64, 24], medianAge: 47.7 },
        { name: "케냐", code: "ke", pop: 55100000, age: [38, 59, 3], medianAge: 20.1 },
        { name: "콜롬비아", code: "co", pop: 52085000, age: [23, 68, 9], medianAge: 31.5 },

        { name: "스페인", code: "es", pop: 47519000, age: [14, 66, 20], medianAge: 44.9 },

        { name: "알제리", code: "dz", pop: 45606000, age: [30, 64, 6], medianAge: 28.5 },

        { name: "폴란드", code: "pl", pop: 41026000, age: [15, 64, 21], medianAge: 42.0 },
        { name: "캐나다", code: "ca", pop: 38781000, age: [16, 65, 19], medianAge: 41.1 },
        { name: "모로코", code: "ma", pop: 37840000, age: [26, 64, 10], medianAge: 29.8 },
        { name: "사우디아라비아", code: "sa", pop: 36947000, age: [25, 71, 4], medianAge: 31.8 },
        { name: "우즈베키스탄", code: "uz", pop: 35163000, age: [31, 63, 6], medianAge: 28.1 },
        { name: "페루", code: "pe", pop: 34352000, age: [26, 66, 8], medianAge: 29.1 },
        { name: "말레이시아", code: "my", pop: 34308000, age: [23, 69, 8], medianAge: 30.3 },
        { name: "가나", code: "gh", pop: 33475000, age: [37, 59, 4], medianAge: 21.5 },
        { name: "우크라이나", code: "ua", pop: 36744000, age: [15, 67, 18], medianAge: 41.2 },
        { name: "네팔", code: "np", pop: 30896000, age: [28, 63, 9], medianAge: 25.3 },
        { name: "베네수엘라", code: "ve", pop: 28838000, age: [27, 63, 10], medianAge: 29.0 },
        { name: "오스트레일리아(호주)", code: "au", pop: 26439000, age: [18, 65, 17], medianAge: 37.5 },
        { name: "카메룬", code: "cm", pop: 28647000, age: [42, 55, 3], medianAge: 18.7 },
        { name: "스웨덴", code: "se", pop: 10612000, age: [17, 62, 21], medianAge: 41.1 },
        { name: "스위스", code: "ch", pop: 8796000, age: [14, 64, 22], medianAge: 43.1 },
        { name: "오스트리아", code: "at", pop: 8958000, age: [14, 62, 24], medianAge: 43.5 },
        { name: "벨기에", code: "be", pop: 11686000, age: [17, 63, 20], medianAge: 41.9 },
        { name: "노르웨이", code: "no", pop: 5474000, age: [17, 63, 20], medianAge: 40.0 },
        { name: "뉴질랜드", code: "nz", pop: 5228000, age: [19, 62, 19], medianAge: 37.9 },
        { name: "싱가포르", code: "sg", pop: 6014000, age: [12, 72, 16], medianAge: 42.2 },
        { name: "쿠바", code: "cu", pop: 11212000, age: [16, 64, 20], medianAge: 42.4 }
    ];

    const getOldDependency = (country) => ((country.age[2] / country.age[1]) * 100).toFixed(1);
    const getAgingIndex = (country) => ((country.age[2] / country.age[0]) * 100).toFixed(1);

    const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

    const formatPop = (num) => {
        if (num >= 100000000) {
            const eok = Math.floor(num / 100000000);
            const man = Math.floor((num % 100000000) / 10000);
            if (man > 0) return `${eok}억 ${man}만 명`;
            return `${eok}억 명`;
        } else {
            const man = Math.floor(num / 10000);
            return `${man}만 명`;
        }
    };

    const getFlagUrl = (code) => `https://flagcdn.com/w320/${code}.png`;

    const state = {
        mode: null,
        questions: [],
        currentIndex: 0,
        score: 0,
        isLocked: false,
        totalQuestions: 10
    };

    const appEl = document.getElementById('app');

    function renderMenu() {
        appEl.innerHTML = `
            <div class="flex-1 flex flex-col px-6 py-10 fade-in h-full justify-center ls-row">
                <div class="w-full ls-w-half flex flex-col items-center justify-center text-center mb-10 ls-my-0">
                    <div class="flex justify-center mb-4">
                        <span class="text-[76px] sm:text-[84px] leading-none drop-shadow-sm">🌍</span>
                    </div>
                    <h1 class="text-[32px] sm:text-[36px] font-extrabold tracking-tight mb-2 text-[#191F28]">인구 수 퀴즈</h1>
                    <p class="text-[#8B95A1] text-[15px] sm:text-[16px] font-medium leading-relaxed break-keep max-w-[280px]">세계 주요 국가들의 인구 수와<br>연령대·고령화 지표를 맞춰보세요.</p>
                </div>
                
                <div class="w-full h-[1px] bg-black/5 mb-8 ls-divider-h"></div>
                <div class="hidden ls-divider-v"></div>

                <div class="w-full max-w-md mx-auto ls-w-half flex flex-col justify-center space-y-3.5">
                    <button onclick="startQuiz('pop')" class="btn-press w-full bg-[#F2F4F6] text-[#191F28] rounded-[20px] p-5 text-left border border-black/5 hover:bg-gray-200/60">
                        <div class="text-[17px] font-bold mb-0.5">인구 수 맞추기</div>
                        <div class="text-[#8B95A1] text-[13px] font-medium">제시된 국가의 인구 수 고르기</div>
                    </button>
                    
                    <button onclick="startQuiz('comp')" class="btn-press w-full bg-[#F2F4F6] text-[#191F28] rounded-[20px] p-5 text-left border border-black/5 hover:bg-gray-200/60">
                        <div class="text-[17px] font-bold mb-0.5">국가 비교하기</div>
                        <div class="text-[#8B95A1] text-[13px] font-medium">인구수, 노년부양비, 중위연령, 노령화지수 비교</div>
                    </button>

                    <button onclick="startQuiz('age')" class="btn-press w-full bg-[#F2F4F6] text-[#191F28] rounded-[20px] p-5 text-left border border-black/5 hover:bg-gray-200/60">
                        <div class="text-[17px] font-bold mb-0.5">인구 구조 맞추기</div>
                        <div class="text-[#8B95A1] text-[13px] font-medium">연령대별 막대그래프를 보고 국가 고르기</div>
                    </button>

                    <div class="pt-3 text-center">
                        <p class="text-[11px] text-gray-400 font-medium">데이터 기준: 2023-2024 통계청/UN 근사치 (총 ${countriesData.length}개국)</p>
                    </div>
                </div>
            </div>
        `;
    }

    function startQuiz(mode) {
        state.mode = mode;
        state.currentIndex = 0;
        state.score = 0;
        state.questions = [];
        state.isLocked = false;

        let availableCountries = shuffle([...countriesData]);

        if (mode === 'pop') {
            for (let i = 0; i < state.totalQuestions; i++) {
                let target = availableCountries[i % availableCountries.length];
                let tempPool = shuffle([...countriesData].filter(c => c.code !== target.code));
                let distractors = tempPool.slice(0, 3).map(c => c.pop);
                let options = shuffle([target.pop, ...distractors]);
                state.questions.push({ type: 'pop', target, options, answer: target.pop });
            }
        } else if (mode === 'comp') {
            const compTypes = [
                { text: '인구가 가장 많은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>b.pop - a.pop)[0], getValueText: (country) => `인구 약 ${formatPop(country.pop)}` },
                { text: '인구가 가장 적은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>a.pop - b.pop)[0], getValueText: (country) => `인구 약 ${formatPop(country.pop)}` },
                { text: '유소년층(0~14세) 비율이 가장 높은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>b.age[0] - a.age[0])[0], getValueText: (country) => `유소년 비율 ${country.age[0]}%` },
                { text: '유소년층(0~14세) 비율이 가장 낮은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>b.age[0] - a.age[0])[0], getValueText: (country) => `유소년 비율 ${country.age[0]}%` },
                { text: '노년층(65세 이상) 비율이 가장 높은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>b.age[2] - a.age[2])[0], getValueText: (country) => `노년 비율 ${country.age[2]}%` },
                { text: '노년층(65세 이상) 비율이 가장 낮은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>b.age[2] - a.age[2])[0], getValueText: (country) => `노년 비율 ${country.age[2]}%` },
                { text: '노년 부양비가 가장 높은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>getOldDependency(b) - getOldDependency(a))[0], getValueText: (country) => `노년부양비 ${getOldDependency(country)}` },
                { text: '노년 부양비가 가장 낮은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>getOldDependency(a) - getOldDependency(b))[0], getValueText: (country) => `노년부양비 ${getOldDependency(country)}` },
                { text: '중위 연령이 가장 높은(고령화된) 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>b.medianAge - a.medianAge)[0], getValueText: (country) => `중위 연령 ${country.medianAge}세` },
                { text: '중위 연령이 가장 낮은(젊은) 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>a.medianAge - b.medianAge)[0], getValueText: (country) => `중위 연령 ${country.medianAge}세` },
                { text: '노령화 지수가 가장 높은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>getAgingIndex(b) - getAgingIndex(a))[0], getValueText: (country) => `노령화 지수 ${getAgingIndex(country)}` },
                { text: '노령화 지수가 가장 낮은 국가는?', getAnswer: (arr) => [...arr].sort((a,b)=>getAgingIndex(a) - getAgingIndex(b))[0], getValueText: (country) => `노령화 지수 ${getAgingIndex(country)}` }
            ];

            for (let i = 0; i < state.totalQuestions; i++) {
                let pool = shuffle([...countriesData]).slice(0, 4);
                let qType = compTypes[Math.floor(Math.random() * compTypes.length)];
                let answer = qType.getAnswer(pool);
                state.questions.push({ type: 'comp', text: qType.text, options: pool, answer: answer, getValueText: qType.getValueText });
            }
        } else if (mode === 'age') {
            for (let i = 0; i < state.totalQuestions; i++) {
                let target = availableCountries[i % availableCountries.length];
                let tempPool = shuffle([...countriesData].filter(c => c.code !== target.code));
                let distractors = tempPool.slice(0, 3);
                let options = shuffle([target, ...distractors]);
                state.questions.push({ type: 'age', target, options, answer: target.code });
            }
        }
        
        renderQuestion();
    }

    function getHeaderHTML() {
        const progressPercent = ((state.currentIndex) / state.totalQuestions) * 100;
        return `
            <div class="px-5 pt-4 pb-3 bg-white/95 backdrop-blur-md z-20 sticky top-0 sm:rounded-t-[32px]">
                <div class="flex items-center justify-between mb-3">
                    <button onclick="renderMenu()" class="btn-press w-9 h-9 flex items-center justify-center bg-gray-100/80 rounded-full text-gray-600">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <span class="font-bold text-gray-400 text-xs tracking-widest">${state.currentIndex + 1} / ${state.totalQuestions}</span>
                    <div class="w-9"></div>
                </div>
                <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-[#3182F6] progress-bar rounded-full" style="width: ${progressPercent}%"></div>
                </div>
            </div>
        `;
    }

    function renderQuestion() {
        const q = state.questions[state.currentIndex];
        state.isLocked = false;
        const qNum = state.currentIndex + 1;
        
        let contentHTML = '';

        if (q.type === 'pop') {
            contentHTML = `
                <div class="flex-1 px-5 py-6 flex flex-col fade-in h-full max-w-3xl mx-auto w-full ls-row justify-center">
                    <div class="w-full ls-w-half flex flex-col items-center justify-center text-center ls-left-align mb-6 ls-my-0">
                        <span class="inline-block text-[#3182F6] font-extrabold text-[13px] tracking-wider uppercase bg-blue-50 px-3.5 py-1 rounded-full mb-4 self-center ls-self-start">Q${qNum}</span>
                        <div class="w-40 h-28 sm:w-52 sm:h-36 rounded-[18px] overflow-hidden shadow-md border border-black/10 relative mb-4 sm:mb-5 mx-auto ls-ml-0">
                            <img src="${getFlagUrl(q.target.code)}" class="w-full h-full object-cover" alt="${q.target.name} 국기" />
                        </div>
                        <h2 class="text-[26px] sm:text-[32px] font-extrabold mb-1.5 tracking-tight">${q.target.name}</h2>
                        <p class="text-[#8B95A1] font-medium text-[15px] sm:text-[16px]">이 국가의 인구 수는 얼마일까요?</p>
                    </div>
                    
                    <div class="w-full h-[1px] bg-black/5 my-3 ls-divider-h"></div>
                    <div class="hidden ls-divider-v"></div>

                    <div class="w-full ls-w-half space-y-3 mt-3 ls-my-0 flex flex-col justify-center">
                        ${q.options.map((opt) => `
                            <button onclick="handleAnswer(${opt}, ${q.answer}, this)" 
                                    class="option-btn btn-press w-full text-left px-5 py-4 sm:py-4.5 rounded-[20px] flex items-center text-[16px] sm:text-[17px] font-bold"
                                    data-val="${opt}">
                                <span>약 ${formatPop(opt)}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        } else if (q.type === 'comp') {
            contentHTML = `
                <div class="flex-1 px-5 py-6 flex flex-col fade-in h-full max-w-3xl mx-auto w-full ls-row justify-center">
                    <div class="w-full ls-w-half flex flex-col items-center justify-center text-center ls-left-align mb-6 ls-my-0">
                        <span class="inline-block text-[#3182F6] font-extrabold text-[13px] tracking-wider uppercase bg-blue-50 px-3.5 py-1 rounded-full mb-4 self-center ls-self-start">Q${qNum}</span>
                        <h2 class="text-[24px] sm:text-[28px] lg:text-[32px] font-extrabold leading-[1.3] break-keep tracking-tight mb-2.5 max-w-sm mx-auto ls-ml-0">${q.text}</h2>
                        <p class="text-[#8B95A1] font-medium text-[14px] sm:text-[15px]">조건에 알맞은 국가를 고르세요.</p>
                    </div>
                    
                    <div class="w-full h-[1px] bg-black/5 my-3 ls-divider-h"></div>
                    <div class="hidden ls-divider-v"></div>

                    <div class="w-full ls-w-half grid grid-cols-2 gap-3 sm:gap-4 mt-3 ls-my-0">
                        ${q.options.map((opt) => `
                            <button onclick="handleAnswer('${opt.code}', '${q.answer.code}', this)" 
                                    class="option-btn btn-press flex flex-col items-center justify-center rounded-[22px] p-4 sm:p-5 gap-2 border border-gray-100 bg-[#F9FAFB] relative overflow-hidden"
                                    data-val="${opt.code}">
                                <div class="w-[60px] h-[40px] sm:w-[80px] sm:h-[52px] rounded-xl overflow-hidden shadow-sm border border-black/10 relative">
                                    <img src="${getFlagUrl(opt.code)}" class="w-full h-full object-cover" alt="${opt.name} 국기" />
                                </div>
                                <span class="font-bold text-[16px] sm:text-[17px] text-center px-1 break-keep leading-tight">${opt.name}</span>
                                <span class="value-label hidden text-[11px] sm:text-[12px] font-bold mt-1 px-2.5 py-0.5 rounded-full bg-white/95 shadow-sm border border-black/5">
                                    ${q.getValueText(opt)}
                                </span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        } else if (q.type === 'age') {
            const young = q.target.age[0];
            const adult = q.target.age[1];
            const old = q.target.age[2];

            contentHTML = `
                <div class="flex-1 px-5 py-6 flex flex-col fade-in h-full max-w-3xl mx-auto w-full ls-row justify-center">
                    <div class="w-full ls-w-half flex flex-col items-center justify-center text-center ls-left-align mb-6 ls-my-0">
                        <span class="inline-block text-[#3182F6] font-extrabold text-[13px] tracking-wider uppercase bg-blue-50 px-3.5 py-1 rounded-full mb-4 self-center ls-self-start">Q${qNum}</span>
                        <h2 class="text-[22px] sm:text-[26px] font-extrabold leading-tight mb-4">다음 인구 구조를 가진 국가는?</h2>
                        
                        <div class="w-full max-w-[320px] bg-[#F9FAFB] p-5 rounded-[20px] border border-gray-200/70 shadow-sm space-y-3 mx-auto ls-ml-0">
                            <div class="text-[12px] font-bold text-gray-400 text-left">연령대별 인구 비율 (%)</div>
                            <div class="w-full h-8 bg-gray-200 rounded-xl overflow-hidden flex shadow-inner mb-3">
                                <div style="width: ${young}%" class="bg-[#38BDF8] h-full flex items-center justify-center text-[11px] font-bold text-white tracking-tighter">${young}%</div>
                                <div style="width: ${adult}%" class="bg-[#3182F6] h-full flex items-center justify-center text-[11px] font-bold text-white tracking-tighter">${adult}%</div>
                                <div style="width: ${old}%" class="bg-[#F43F5E] h-full flex items-center justify-center text-[11px] font-bold text-white tracking-tighter">${old}%</div>
                            </div>

                            <div class="grid grid-cols-3 text-[12px] font-semibold text-gray-600 gap-1 text-center">
                                <div class="flex flex-col items-center">
                                    <span class="text-gray-400 text-[11px]">유소년</span>
                                    <span class="text-gray-800 font-bold">${young}%</span>
                                </div>
                                <div class="flex flex-col items-center border-x border-gray-200">
                                    <span class="text-gray-400 text-[11px]">청장년</span>
                                    <span class="text-gray-800 font-bold">${adult}%</span>
                                </div>
                                <div class="flex flex-col items-center">
                                    <span class="text-gray-400 text-[11px]">노년</span>
                                    <span class="text-gray-800 font-bold">${old}%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-full h-[1px] bg-black/5 my-3 ls-divider-h"></div>
                    <div class="hidden ls-divider-v"></div>

                    <div class="w-full ls-w-half grid grid-cols-2 gap-3 sm:gap-4 mt-3 ls-my-0">
                        ${q.options.map((opt) => `
                            <button onclick="handleAnswer('${opt.code}', '${q.answer}', this)" 
                                    class="option-btn btn-press flex flex-col items-center justify-center rounded-[22px] p-4 sm:p-5 gap-2.5 border border-gray-100 bg-[#F9FAFB]"
                                    data-val="${opt.code}">
                                <div class="w-[56px] h-[38px] sm:w-[76px] sm:h-[50px] rounded-xl overflow-hidden shadow-sm border border-black/10 relative">
                                    <img src="${getFlagUrl(opt.code)}" class="w-full h-full object-cover" alt="${opt.name} 국기" />
                                </div>
                                <span class="font-bold text-[15px] sm:text-[16px] text-center px-1 break-keep leading-tight">${opt.name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        appEl.innerHTML = getHeaderHTML() + contentHTML;
    }

    function handleAnswer(selectedValue, correctValue, btnEl) {
        if (state.isLocked) return;
        state.isLocked = true;

        const isCorrect = String(selectedValue) === String(correctValue);
        if (isCorrect) state.score++;

        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => {
            const val = btn.getAttribute('data-val');
            
            const label = btn.querySelector('.value-label');
            if (label) label.classList.remove('hidden');

            if (String(val) === String(correctValue)) {
                btn.classList.add('correct');
            } else if (String(val) === String(selectedValue) && !isCorrect) {
                btn.classList.add('wrong');
            } else {
                btn.classList.add('dimmed');
            }
        });

        if (navigator.vibrate) {
            if (isCorrect) navigator.vibrate(40);
            else navigator.vibrate([40, 50, 40]);
        }

        setTimeout(() => {
            state.currentIndex++;
            if (state.currentIndex >= state.totalQuestions) {
                renderResult();
            } else {
                renderQuestion();
            }
        }, 2200);
    }

    function renderResult() {
        const percentage = (state.score / state.totalQuestions) * 100;
        let comment = "";
        let emoji = "";
        
        if (percentage === 100) { comment = "완벽해요! 10문제 모두 맞췄습니다."; emoji = "🏆"; }
        else if (percentage >= 70) { comment = "훌륭해요! 조금만 더 하면 만점이에요."; emoji = "👏"; }
        else if (percentage >= 40) { comment = "좋아요! 자주 헷갈리는 국가를 복습해봐요."; emoji = "👍"; }
        else { comment = "괜찮아요! 퀴즈를 통해 인구를 익혀보세요."; emoji = "💪"; }

        appEl.innerHTML = `
            <div class="flex-1 flex flex-col justify-between p-6 fade-in h-full max-w-3xl mx-auto w-full ls-row">
                <div class="w-full ls-w-half flex flex-col items-center justify-center text-center ls-left-align mb-8 ls-my-0">
                    <div class="text-[64px] mb-3">${emoji}</div>
                    <h2 class="text-[15px] font-bold text-[#8B95A1] mb-1.5">총 ${state.totalQuestions}문제 중</h2>
                    <div class="text-[56px] font-extrabold text-[#191F28] leading-none mb-4 tracking-tight">
                        ${state.score}<span class="text-2xl text-[#191F28] font-bold">개 정답</span>
                    </div>
                    <p class="text-[15px] font-bold text-[#4E5968] bg-[#F2F4F6] px-5 py-2.5 rounded-[16px] break-keep">${comment}</p>
                </div>
                
                <div class="w-full h-[1px] bg-black/5 my-4 ls-divider-h"></div>
                <div class="hidden ls-divider-v"></div>

                <div class="w-full ls-w-half space-y-3 mt-4 ls-my-0 flex flex-col justify-center">
                    <button onclick="startQuiz('${state.mode}')" class="btn-press w-full bg-[#3182F6] text-white font-bold text-[16px] rounded-[20px] py-4 shadow-sm hover:bg-blue-600">
                        다시 도전하기
                    </button>
                    <button onclick="renderMenu()" class="btn-press w-full bg-[#F2F4F6] text-[#4E5968] font-bold text-[16px] rounded-[20px] py-4 hover:bg-gray-200">
                        홈으로 돌아가기
                    </button>
                </div>
            </div>
        `;
    }

    renderMenu();

</script>
</body>
</html>
